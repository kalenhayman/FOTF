<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./resources.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/tokens/fonts.css">
<link rel="stylesheet" href="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/tokens/colors.css">
<script src="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/_ds_bundle.js"></script>
</helmet>
<section id="book" style="background:#1E5B3F;color:#FFFFFF">
  <div style="max-width:1200px;margin:0 auto;padding:clamp(56px,7vw,88px) clamp(20px,4vw,40px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:28px">
    <div style="display:flex;flex-direction:column;gap:14px;max-width:620px">
      <h2 style="margin:0;font:600 condensed clamp(32px,3.8vw,44px)/1.05 Archivo,sans-serif;text-wrap:balance">{{ headline }}</h2>
      <p style="margin:0;font:400 18px/1.5 Archivo,sans-serif">Twenty minutes, no obligation. Or email <a href="mailto:sales@focusonthefield.com" style="color:#FFFFFF;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px" style-hover="text-decoration-color:#FFD100;text-decoration-thickness:3px;color:#FFFFFF">sales@focusonthefield.com</a></p>
    </div>
    <dc-import name="FotfButton" tone="dark" hint-size="130px,48px"></dc-import>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1200, &quot;height&quot;: 320}, &quot;headline&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;More field time, less computer time&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() { return { headline: this.props.headline ?? 'More field time, less computer time' }; }
}
</script>
</body>
</html>
