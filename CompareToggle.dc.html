<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./resources.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/tokens/fonts.css">
<link rel="stylesheet" href="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/tokens/colors.css">
<script src="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/_ds_bundle.js"></script>
</helmet>
<div style="display:flex;flex-direction:column;gap:18px">
  <div role="radiogroup" aria-label="Compare options" style="display:flex;flex-wrap:wrap;gap:8px">
    <sc-for list="{{ opts }}" as="o" hint-placeholder-count="3">
      <button role="radio" aria-checked="{{ o.on }}" onClick="{{ o.pick }}" style="flex:1 1 150px;min-height:52px;padding:0 16px;border-radius:6px;font:700 16px/1 Archivo,sans-serif;cursor:pointer;border:2px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.fg }}" style-hover="border-color:#FFD100" style-focus="outline:3px solid #FFD100;outline-offset:2px">{{ o.label }}</button>
    </sc-for>
  </div>
  <div style="background:#F4F1EA;color:#111111;border:2px solid #111111;border-radius:6px;box-shadow:6px 6px 0 #111111;overflow:hidden">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 24px;padding:16px 20px;background:#111111;color:#FFFFFF">
      <b style="font:700 condensed 28px/1 Archivo,sans-serif;font-stretch:66%;text-transform:uppercase;letter-spacing:-.005em">{{ summary }}</b>
      <span style="display:inline-flex;align-items:baseline;gap:8px;font:500 13px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:#FFD100"><span style="font:700 condensed 34px/1 Archivo,sans-serif;font-stretch:66%;color:{{ scoreC }}">{{ left }}</span>left to you</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-top:1px solid #D9CFC0;border-right:1px solid #D9CFC0;font:600 17px/1.3 Archivo,sans-serif">
          <span>{{ r.label }}</span>
          <span style="display:inline-flex;align-items:center;gap:6px;border-radius:4px;padding:6px 9px;background:{{ r.bg }};color:#FFFFFF;font:500 11px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap"><span aria-hidden="true" style="width:13px;height:13px;background:#FFFFFF;-webkit-mask:{{ r.mask }};mask:{{ r.mask }}"></span>{{ r.status }}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 900, &quot;height&quot;: 300}}">
class Component extends DCLogic {
  state = { pick: 0 };
  R = ['Registration', 'Parent emails', 'Tools & tech', 'Holiday cover'];
  O = [['FOTF', 'One team.', [1, 1, 1, 1]], ['Hire', 'One person.', [1, 1, 0, 0]], ['Software', 'You run it.', [0, 0, 0, 0]]];
  renderVals() {
    const pick = this.state.pick, [, summary, st] = this.O[pick], n = st.filter(x => !x).length;
    const m = k => `url(assets/icons/${k}.svg) center/contain no-repeat`;
    return { summary, left: String(n), scoreC: n ? '#FF8A70' : '#FFD100',
      opts: this.O.map(([label], i) => ({ label, on: i === pick ? 'true' : 'false', bg: i === pick ? '#FFD100' : 'transparent', fg: i === pick ? '#111111' : '#FFFFFF', bd: i === pick ? '#111111' : 'rgba(255,255,255,.7)', pick: () => this.setState({ pick: i }) })),
      rows: this.R.map((label, i) => ({ label, status: st[i] ? 'Done' : 'You', bg: st[i] ? '#1E5B3F' : '#B0412E', mask: m(st[i] ? 'check' : 'x') })) };
  }
}
</script>
</body>
</html>
