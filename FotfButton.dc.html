<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./resources.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/tokens/fonts.css">
<link rel="stylesheet" href="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/tokens/colors.css">
<script src="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/_ds_bundle.js"></script>
</helmet>
<sc-if value="{{ p }}" hint-placeholder-val="{{ true }}"><a href="{{ href }}" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:6px;font:600 16px/1 Archivo,sans-serif;text-decoration:none;white-space:nowrap;box-sizing:border-box;transition:background .15s ease,color .15s ease;background:#FFD100;color:#111111;border:0" style-hover="background:#F2C700;color:#111111" style-active="background:#E3BA00" style-focus="outline:2px solid {{ ring }};outline-offset:3px">{{ label }}</a></sc-if>
<sc-if value="{{ s }}" hint-placeholder-val="{{ false }}"><a href="{{ href }}" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:6px;font:600 16px/1 Archivo,sans-serif;text-decoration:none;white-space:nowrap;box-sizing:border-box;transition:background .15s ease,color .15s ease;background:transparent;color:#1E5B3F;border:1.5px solid #1E5B3F" style-hover="background:#E4EEE8;color:#1E5B3F" style-active="background:#1E5B3F;color:#FFFFFF" style-focus="outline:2px solid #111111;outline-offset:3px">{{ label }}</a></sc-if>
<sc-if value="{{ sd }}" hint-placeholder-val="{{ false }}"><a href="{{ href }}" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:6px;font:600 16px/1 Archivo,sans-serif;text-decoration:none;white-space:nowrap;box-sizing:border-box;transition:background .15s ease,color .15s ease;background:transparent;color:#FFFFFF;border:1.5px solid #FFFFFF" style-hover="background:#FFFFFF;color:#1E5B3F" style-focus="outline:2px solid #FFD100;outline-offset:3px">{{ label }}</a></sc-if>
<sc-if value="{{ t }}" hint-placeholder-val="{{ false }}"><a href="{{ href }}" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;font:600 16px/1.2 Archivo,sans-serif;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px;color:#B0412E" style-hover="text-decoration-thickness:3px;color:#B0412E" style-active="color:#93362A" style-focus="outline:2px solid #111111;outline-offset:4px;border-radius:2px">{{ label }}<span aria-hidden="true">→</span></a></sc-if>
<sc-if value="{{ td }}" hint-placeholder-val="{{ false }}"><a href="{{ href }}" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;font:600 16px/1.2 Archivo,sans-serif;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px;color:#FFFFFF" style-hover="text-decoration-color:#FFD100;text-decoration-thickness:3px;color:#FFFFFF" style-focus="outline:2px solid #FFD100;outline-offset:4px;border-radius:2px">{{ label }}<span aria-hidden="true">→</span></a></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 320, &quot;height&quot;: 80}, &quot;label&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Book a call&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;href&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;#book&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;variant&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;primary&quot;, &quot;secondary&quot;, &quot;text&quot;], &quot;default&quot;: &quot;primary&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;tone&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;light&quot;, &quot;dark&quot;], &quot;default&quot;: &quot;light&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'primary', d = (this.props.tone ?? 'light') === 'dark';
    return {
      label: this.props.label ?? 'Book a call',
      href: this.props.href ?? '#book',
      ring: d ? '#FFFFFF' : '#111111',
      p: v === 'primary', s: v === 'secondary' && !d, sd: v === 'secondary' && d,
      t: v === 'text' && !d, td: v === 'text' && d
    };
  }
}
</script>
</body>
</html>
