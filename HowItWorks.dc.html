<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./resources.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/tokens/fonts.css">
<link rel="stylesheet" href="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/tokens/colors.css">
<script src="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/_ds_bundle.js"></script>
</helmet>
<div id="how-steps" style="position:relative">
  <sc-if value="{{ row }}" hint-placeholder-val="{{ true }}">
    <div style="position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;padding-top:8px">
      <span aria-hidden="true" style="position:absolute;left:0;right:0;top:14px;height:3px;background:#E2E0DA"></span>
      <span aria-hidden="true" style="position:absolute;left:0;top:14px;height:3px;background:#FFD100;width:{{ fill }};transition:width .5s ease"></span>
      <sc-for list="{{ steps }}" as="s" hint-placeholder-count="4">
        <div style="position:relative;display:flex;flex-direction:column;gap:12px">
          <span aria-hidden="true" style="width:16px;height:16px;border-radius:50%;background:{{ s.dot }};border:3px solid {{ s.ring }};transition:background .3s ease,border-color .3s ease"></span>
          <span style="font:500 13px/1 'JetBrains Mono',monospace;letter-spacing:.08em;color:#B0412E">{{ s.n }}</span>
          <h3 style="margin:0;font:600 19px/1.3 Archivo,sans-serif;opacity:{{ s.op }};transition:opacity .3s ease">{{ s.t }}</h3>
        </div>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ col }}" hint-placeholder-val="{{ false }}">
    <div style="position:relative;display:flex;flex-direction:column;gap:28px;padding-left:36px">
      <span aria-hidden="true" style="position:absolute;left:6px;top:8px;bottom:8px;width:3px;background:#E2E0DA"></span>
      <span aria-hidden="true" style="position:absolute;left:6px;top:8px;width:3px;background:#FFD100;height:{{ fill }};transition:height .5s ease"></span>
      <sc-for list="{{ steps }}" as="s" hint-placeholder-count="4">
        <div style="position:relative;display:flex;flex-direction:column;gap:8px">
          <span aria-hidden="true" style="position:absolute;left:-36px;top:0;width:16px;height:16px;border-radius:50%;background:{{ s.dot }};border:3px solid {{ s.ring }};transition:background .3s ease,border-color .3s ease"></span>
          <span style="font:500 12px/1 'JetBrains Mono',monospace;letter-spacing:.08em;color:#B0412E">{{ s.n }}</span>
          <h3 style="margin:0;font:600 19px/1.3 Archivo,sans-serif;opacity:{{ s.op }}">{{ s.t }}</h3>
        </div>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1200, &quot;height&quot;: 220}}">
class Component extends DCLogic {
  state = { lit: 0, w: typeof window !== 'undefined' ? window.innerWidth : 1200 };
  T = [['Book a call', 'Twenty minutes on your season.'], ['Meet your team', 'A named account manager learns your setup.'], ['We take it on', 'We run the work, start to finish.'], ['See it in your portal', 'Every task tracked and marked done.']];
  componentDidMount() {
    this.onS = () => {
      const el = document.getElementById('how-steps'); if (!el) return;
      const r = el.getBoundingClientRect(), vh = window.innerHeight || 800;
      const p = (vh * 0.85 - r.top) / Math.max(1, vh * 0.45);
      const lit = Math.max(0, Math.min(4, Math.ceil(p * 4)));
      if (lit !== this.state.lit || window.innerWidth !== this.state.w) this.setState({ lit, w: window.innerWidth });
    };
    window.addEventListener('scroll', this.onS, { passive: true }); window.addEventListener('resize', this.onS);
    setTimeout(this.onS, 50);
  }
  componentWillUnmount() { window.removeEventListener('scroll', this.onS); window.removeEventListener('resize', this.onS); }
  renderVals() {
    const { lit, w } = this.state, row = w >= 760;
    const fill = lit === 0 ? '0%' : lit === 4 ? '100%' : (row ? ((lit - 1) * 25 + 12.5) : ((lit - 1) * 33.3 + 8)) + '%';
    return { row, col: !row, fill,
      steps: this.T.map(([t, d], i) => ({ n: '0' + (i + 1), t, d, dot: i < lit ? '#1E5B3F' : '#FFFFFF', ring: i < lit ? '#1E5B3F' : '#E2E0DA', op: i < lit ? 1 : 0.55 })) };
  }
}
</script>
</body>
</html>
