<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./resources.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/tokens/fonts.css">
<link rel="stylesheet" href="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/tokens/colors.css">
<script src="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/_ds_bundle.js"></script>
</helmet>
<div id="how-steps" style="position:relative;color:#FFFFFF">
  <sc-if value="{{ row }}" hint-placeholder-val="{{ true }}">
    <div style="position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding-top:12px">
      <span aria-hidden="true" style="position:absolute;left:0;right:0;top:22px;height:4px;background:rgba(255,255,255,.18)"></span>
      <span aria-hidden="true" style="position:absolute;left:0;top:22px;height:4px;background:#FFD100;width:{{ fill }};transition:width .5s ease"></span>
      <sc-for list="{{ steps }}" as="s" hint-placeholder-count="4">
        <div style="position:relative;display:flex;flex-direction:column;gap:14px">
          <span aria-hidden="true" style="width:24px;height:24px;border-radius:50%;background:{{ s.dot }};border:3px solid {{ s.ring }};transition:background .3s ease,border-color .3s ease"></span>
          <div style="display:flex;align-items:baseline;gap:12px;opacity:{{ s.op }};transition:opacity .3s ease"><span style="font:700 condensed 56px/1 Archivo,sans-serif;font-stretch:66%;text-transform:uppercase;letter-spacing:-.005em;color:#FFD100">{{ s.n }}</span><span style="font:700 condensed 26px/1 Archivo,sans-serif;font-stretch:66%;text-transform:uppercase;letter-spacing:-.005em">{{ s.t }}</span></div>
        </div>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ col }}" hint-placeholder-val="{{ false }}">
    <div style="position:relative;display:flex;flex-direction:column;gap:22px;padding-left:44px">
      <span aria-hidden="true" style="position:absolute;left:10px;top:10px;bottom:10px;width:4px;background:rgba(255,255,255,.18)"></span>
      <span aria-hidden="true" style="position:absolute;left:10px;top:10px;width:4px;background:#FFD100;height:{{ fill }};transition:height .5s ease"></span>
      <sc-for list="{{ steps }}" as="s" hint-placeholder-count="4">
        <div style="position:relative;display:flex;align-items:baseline;gap:12px;opacity:{{ s.op }}">
          <span aria-hidden="true" style="position:absolute;left:-44px;top:8px;width:24px;height:24px;border-radius:50%;background:{{ s.dot }};border:3px solid {{ s.ring }}"></span>
          <span style="font:700 condensed 44px/1 Archivo,sans-serif;font-stretch:66%;text-transform:uppercase;letter-spacing:-.005em;color:#FFD100">{{ s.n }}</span><span style="font:700 condensed 26px/1 Archivo,sans-serif;font-stretch:66%;text-transform:uppercase;letter-spacing:-.005em">{{ s.t }}</span>
        </div>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 160}}">
class Component extends DCLogic {
  state = { lit: 0, w: typeof window !== 'undefined' ? window.innerWidth : 1280 };
  T = ['Book a call', 'Meet your team', 'Handover', 'Track live'];
  componentDidMount() {
    this.onS = () => {
      const el = document.getElementById('how-steps'); if (!el) return;
      const r = el.getBoundingClientRect(), vh = window.innerHeight || 800;
      const lit = Math.max(0, Math.min(4, Math.ceil((vh * 0.85 - r.top) / Math.max(1, vh * 0.45) * 4)));
      if (lit !== this.state.lit || window.innerWidth !== this.state.w) this.setState({ lit, w: window.innerWidth });
    };
    window.addEventListener('scroll', this.onS, { passive: true }); window.addEventListener('resize', this.onS); setTimeout(this.onS, 50);
  }
  componentWillUnmount() { window.removeEventListener('scroll', this.onS); window.removeEventListener('resize', this.onS); }
  renderVals() {
    const { lit, w } = this.state, row = w >= 860;
    const fill = lit === 0 ? '0%' : lit === 4 ? '100%' : (row ? ((lit - 1) * 25 + 12.5) : ((lit - 1) * 33.3 + 8)) + '%';
    return { row, col: !row, fill,
      steps: this.T.map((t, i) => ({ n: '0' + (i + 1), t, dot: i < lit ? '#FFD100' : 'transparent', ring: i < lit ? '#FFD100' : 'rgba(255,255,255,.45)', op: i < lit ? 1 : 0.45 })) };
  }
}
</script>
</body>
</html>
