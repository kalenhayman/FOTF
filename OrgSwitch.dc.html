<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./resources.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/tokens/fonts.css">
<link rel="stylesheet" href="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/tokens/colors.css">
<script src="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/_ds_bundle.js"></script>
</helmet>
<div style="display:flex;flex-direction:column;gap:20px">
  <div style="display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between">
    <div role="tablist" aria-label="Organisation type" style="display:flex;flex-wrap:wrap;gap:8px">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
        <button role="tab" aria-selected="{{ t.on }}" onClick="{{ t.pick }}" style="min-height:44px;padding:0 18px;border-radius:999px;font:700 15px/1 Archivo,sans-serif;cursor:pointer;border:2px solid {{ t.bd }};background:{{ t.bg }};color:{{ t.fg }};transition:background .15s ease" style-hover="border-color:#FFD100" style-focus="outline:3px solid #FFD100;outline-offset:2px">{{ t.label }}</button>
      </sc-for>
    </div>
    <span style="display:inline-flex;align-items:center;gap:10px;background:#111111;color:#FFFFFF;border-radius:6px;padding:10px 14px;font:500 14px/1.2 Archivo,sans-serif"><span style="font:500 13px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:#FFD100">Live</span>{{ example }}</span>
  </div>
  <div role="tabpanel" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:20px">
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="4">
      <div style="background:#F4F1EA;color:#111111;border:2px solid #111111;border-radius:6px;box-shadow:6px 6px 0 #111111;padding:22px;display:flex;flex-direction:column;gap:14px;background:{{ c.bg }};transition:transform .15s ease,box-shadow .15s ease" style-hover="transform:translate(-3px,-3px);box-shadow:9px 9px 0 #111111">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
          <span aria-hidden="true" style="width:44px;height:44px;border-radius:6px;background:#1E5B3F;display:flex;align-items:center;justify-content:center"><span style="width:26px;height:26px;display:block;background:#FFFFFF;-webkit-mask:{{ c.mask }};mask:{{ c.mask }}"></span></span>
          <span style="font:500 11px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em;background:#B0412E;color:#FFFFFF;border-radius:4px;padding:6px 8px;opacity:{{ c.tagOp }}">Top</span>
        </div>
        <h3 style="margin:0;font:700 condensed 26px/1 Archivo,sans-serif;font-stretch:66%;text-transform:uppercase;letter-spacing:-.005em">{{ c.title }}</h3>
        <sc-if value="{{ detail }}" hint-placeholder-val="{{ false }}">
          <ul style="margin:0;padding:12px 0 0;border-top:2px solid #111111;list-style:none;display:flex;flex-direction:column;gap:8px">
            <sc-for list="{{ c.items }}" as="i" hint-placeholder-count="3">
              <li style="display:flex;gap:10px;align-items:center;font:500 16px/1.3 Archivo,sans-serif"><span aria-hidden="true" style="width:18px;height:18px;flex:none;background:#B0412E;-webkit-mask:url(&quot;assets/icons/check.svg&quot;) center/contain no-repeat;mask:url(&quot;assets/icons/check.svg&quot;) center/contain no-repeat"></span>{{ i }}</li>
            </sc-for>
          </ul>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 320}, &quot;detail&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { org: 0 };
  S = [
    { icon: 'calendar', title: 'Club & league ops', items: ['Registration', 'Schedules', 'Records'] },
    { icon: 'headphones', title: 'Member support', items: ['Inbox', 'Forms', 'Refunds'] },
    { icon: 'megaphone', title: 'Marketing & comms', items: ['Emails', 'Social', 'Website'] },
    { icon: 'monitor', title: 'Tech & systems', items: ['Setup', 'Payments', 'Logins'] }
  ];
  O = [['Club', [0, 1], 'Registration: done'], ['League', [0, 3], 'Fixtures published weekly'], ['Event', [2, 0], 'Check-in packs sent'], ['Governing body', [1, 3], 'Renewals chased'], ['Company', [2, 1], 'Referrals followed up']];
  renderVals() {
    const org = this.state.org, [, first, example] = this.O[org];
    const order = [...first, ...[0, 1, 2, 3].filter(i => !first.includes(i))];
    return {
      detail: this.props.detail === true || this.props.detail === 'true', example,
      tabs: this.O.map(([label], i) => ({ label, on: i === org ? 'true' : 'false',
        bg: i === org ? '#B0412E' : 'transparent', fg: '#FFFFFF', bd: i === org ? '#B0412E' : 'rgba(255,255,255,.7)', pick: () => this.setState({ org: i }) })),
      cards: order.map((si, k) => { const s = this.S[si], top = k < first.length; return {
        title: s.title, items: s.items, mask: `url(assets/icons/${s.icon}.svg) center/contain no-repeat`,
        bg: top ? '#F3E6D8' : '#F4F1EA', tagOp: top ? 1 : 0 }; })
    };
  }
}
</script>
</body>
</html>
