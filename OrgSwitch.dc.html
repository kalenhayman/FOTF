<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./resources.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/tokens/fonts.css">
<link rel="stylesheet" href="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/tokens/colors.css">
<script src="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/_ds_bundle.js"></script>
</helmet>
<div style="display:flex;flex-direction:column;gap:24px">
  <div role="tablist" aria-label="Organisation type" style="display:flex;flex-wrap:wrap;gap:8px">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
      <button role="tab" aria-selected="{{ t.on }}" onClick="{{ t.pick }}" style="min-height:44px;padding:0 16px;border-radius:6px;font:500 15px/1 Archivo,sans-serif;cursor:pointer;border:1px solid {{ t.bd }};background:{{ t.bg }};color:{{ t.fg }}" style-hover="border-color:#1E5B3F" style-focus="outline:2px solid #111111;outline-offset:2px">{{ t.label }}</button>
    </sc-for>
  </div>
  <p style="margin:0;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;font:400 17px/1.5 Archivo,sans-serif"><span style="font:500 13px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:#B0412E">Example</span>{{ example }}</p>
  <div role="tabpanel" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px">
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="4">
      <div style="border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:14px;background:{{ c.bg }};border:1px solid {{ c.bd }};transition:background .2s ease">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><span aria-hidden="true" style="width:32px;height:32px;display:block;background:#1E5B3F;-webkit-mask:{{ c.mask }};mask:{{ c.mask }}"></span><span style="font:500 11px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:#93362A;opacity:{{ c.tagOp }}">Start here</span></div>
        <h3 style="margin:0;font:600 clamp(20px,1.6vw,22px)/1.25 Archivo,sans-serif">{{ c.title }}</h3>
        <p style="margin:0;font:400 17px/1.5 Archivo,sans-serif">{{ c.line }}</p>
        <sc-if value="{{ detail }}" hint-placeholder-val="{{ false }}">
          <ul style="margin:4px 0 0;padding:14px 0 0;border-top:1px solid {{ c.rule }};list-style:none;display:flex;flex-direction:column;gap:10px">
            <sc-for list="{{ c.items }}" as="i" hint-placeholder-count="3">
              <li style="display:flex;gap:10px;align-items:flex-start;font:400 16px/1.4 Archivo,sans-serif"><span aria-hidden="true" style="width:18px;height:18px;margin-top:2px;flex:none;background:#1E5B3F;-webkit-mask:url(&quot;assets/icons/check.svg&quot;) center/contain no-repeat;mask:url(&quot;assets/icons/check.svg&quot;) center/contain no-repeat"></span>{{ i }}</li>
            </sc-for>
          </ul>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1200, &quot;height&quot;: 420}, &quot;detail&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { org: 0 };
  S = [
    { icon: 'calendar', title: 'Club & league operations', line: 'Registration, rosters and schedules.', items: ['Registration and rosters', 'Schedules and fixtures', 'Board paperwork and records'] },
    { icon: 'headphones', title: 'Member & customer support', line: 'Parent and member questions answered.', items: ['Parent and member inbox', 'Waivers and missing forms', 'Payment and refund questions'] },
    { icon: 'megaphone', title: 'Marketing & communications', line: 'Emails, social and your website.', items: ['Season emails and updates', 'Social posts and tryout promotion', 'Website kept current'] },
    { icon: 'monitor', title: 'Technology & systems', line: 'Setup and care of the tools you use.', items: ['Registration platform setup', 'Scheduling and payment tools', 'Volunteer logins and access'] }
  ];
  O = [
    ['Club', [0, 1], 'Spring registration opened and rosters sent to every coach.'],
    ['League', [0, 3], 'Fixtures for every division published and kept up to date.'],
    ['Event', [2, 0], 'Tournament check-in packs sent to every team.'],
    ['Governing body', [1, 3], 'Membership renewals chased and records updated.'],
    ['Company', [2, 1], 'Club referrals logged and followed up each week.']
  ];
  renderVals() {
    const org = this.state.org, [, first, example] = this.O[org];
    const order = [...first, ...[0, 1, 2, 3].filter(i => !first.includes(i))];
    const mask = n => `url(assets/icons/${n}.svg) center/contain no-repeat`;
    return {
      detail: this.props.detail === true || this.props.detail === 'true',
      example,
      tabs: this.O.map(([label], i) => ({ label, on: i === org ? 'true' : 'false',
        bg: i === org ? '#1E5B3F' : '#FFFFFF', fg: i === org ? '#FFFFFF' : '#111111', bd: i === org ? '#1E5B3F' : '#E2E0DA',
        pick: () => this.setState({ org: i }) })),
      cards: order.map((si, k) => { const s = this.S[si], top = k < first.length; return {
        title: s.title, line: s.line, items: s.items, mask: mask(s.icon),
        bg: top ? '#F3E6D8' : '#FFFFFF', bd: top ? '#F3E6D8' : '#E2E0DA', rule: top ? '#E3D2BF' : '#E2E0DA', tagOp: top ? 1 : 0 }; })
    };
  }
}
</script>
</body>
</html>
