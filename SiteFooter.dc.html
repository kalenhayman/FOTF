<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./resources.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/tokens/fonts.css">
<link rel="stylesheet" href="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/tokens/colors.css">
<script src="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/_ds_bundle.js"></script>
</helmet>
<footer style="background:#111111;color:#FFFFFF;border-top:2px solid #111111">
  <div style="max-width:1280px;margin:0 auto;padding:56px clamp(20px,4vw,48px) 112px;display:flex;flex-direction:column;gap:44px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:32px">
      <div style="display:flex;flex-direction:column;gap:22px">
        <a href="Home.dc.html" aria-label="Focus on the Field home" style="text-decoration:none;align-self:flex-start"><span style="font:700 condensed 28px/1 Archivo,sans-serif;color:#FFFFFF;white-space:nowrap"><span style="display:inline-block;padding-bottom:2px;border-bottom:3px solid #FFD100">Focus</span> on the Field</span></a>
        <div style="display:flex;gap:8px">
          <sc-for list="{{ socials }}" as="s" hint-placeholder-count="4">
            <a href="#" aria-label="{{ s.label }}" style="width:44px;height:44px;border:1.5px solid #FFFFFF;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#FFFFFF" style-hover="background:#FFD100;border-color:#FFD100;color:#111111" style-focus="outline:3px solid #FFD100;outline-offset:2px"><span style="width:20px;height:20px;background:currentColor;-webkit-mask:{{ s.mask }};mask:{{ s.mask }};display:block"></span></a>
          </sc-for>
        </div>
      </div>
      <sc-for list="{{ cols }}" as="c" hint-placeholder-count="3">
        <div style="display:flex;flex-direction:column;gap:4px">
          <span style="font:500 13px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:#FFD100;margin-bottom:10px">{{ c.title }}</span>
          <sc-for list="{{ c.links }}" as="l" hint-placeholder-count="4">
            <a href="{{ l.href }}" style="font:400 16px/1.3 Archivo,sans-serif;color:#FFFFFF;text-decoration:none;padding:6px 0" style-hover="color:#FFD100" style-focus="outline:3px solid #FFD100;outline-offset:2px">{{ l.label }}</a>
          </sc-for>
        </div>
      </sc-for>
    </div>
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 32px;padding-top:20px;border-top:1px solid #2A2A2A;font:400 14px/1.5 Archivo,sans-serif;color:#BDBDBD">
      <span>Serving clubs nationally from San Francisco, California.</span>
      <span>Site designed by AVA Studio.</span>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 360}}">
class Component extends DCLogic {
  renderVals() {
    const m = n => `url(${(window.__resources && window.__resources['lucide-' + n]) || `assets/icons/${n}.svg`}) center/contain no-repeat`;
    const L = a => a.map(([label, href]) => ({ label, href }));
    return {
      socials: [['Instagram','instagram'],['Facebook','facebook'],['LinkedIn','linkedin'],['YouTube','youtube']].map(([label, i]) => ({ label, mask: m(i) })),
      cols: [
        { title: 'Site', links: L([['Services','Services.dc.html'],['How it works','Home.dc.html#how'],['About','About.dc.html'],['Client login','#login']]) },
        { title: 'More', links: L([['Partners','Partners.dc.html'],['Resources','Resources.dc.html'],['Program in a Prompt','Resources.dc.html#prompt']]) },
        { title: 'Contact', links: L([['sales@focusonthefield.com','mailto:sales@focusonthefield.com'],['Book a call','#book']]) }
      ]
    };
  }
}
</script>
</body>
</html>
