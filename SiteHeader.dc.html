<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./resources.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/tokens/fonts.css">
<link rel="stylesheet" href="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/tokens/colors.css">
<script src="ds/design-system-818b5715-8859-4a00-8281-c06910e8e5e2/_ds_bundle.js"></script>
</helmet>
<header style="position:sticky;top:0;z-index:50;background:#FFFFFF;border-bottom:1px solid #E2E0DA">
  <div style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,40px);height:72px;display:flex;align-items:center;gap:28px">
    <a href="Home.dc.html" aria-label="Focus on the Field home" style="text-decoration:none;flex:none" style-focus="outline:2px solid #111111;outline-offset:4px"><span style="font:700 condensed 24px/1 Archivo,sans-serif;color:#111111;white-space:nowrap"><span style="display:inline-block;padding-bottom:2px;border-bottom:3px solid #FFD100">Focus</span> on the Field</span></a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Main" style="display:flex;align-items:center;gap:28px;margin-left:auto">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="3">
          <a href="{{ n.href }}" aria-current="{{ n.current }}" style="font:500 16px/1 Archivo,sans-serif;color:#111111;text-decoration:none;padding:10px 0 7px;border-bottom:3px solid {{ n.line }}" style-hover="border-bottom-color:#FFD100" style-focus="outline:2px solid #111111;outline-offset:2px">{{ n.label }}</a>
        </sc-for>
        <a href="#login" style="font:500 16px/1 Archivo,sans-serif;color:#111111;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px" style-hover="text-decoration-thickness:3px;text-decoration-color:#FFD100" style-focus="outline:2px solid #111111;outline-offset:2px">Client login</a>
        <dc-import name="FotfButton" hint-size="130px,48px"></dc-import>
      </nav>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggle }}" aria-label="Open menu" aria-expanded="{{ open }}" style="margin-left:auto;width:44px;height:44px;border:1.5px solid #111111;border-radius:6px;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0" style-focus="outline:2px solid #111111;outline-offset:3px">
        <span style="width:18px;height:1.5px;background:#111111;display:block"></span><span style="width:18px;height:1.5px;background:#111111;display:block"></span><span style="width:18px;height:1.5px;background:#111111;display:block"></span>
      </button>
    </sc-if>
  </div>
</header>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-label="Menu" style="position:fixed;inset:0;z-index:100;background:#FFFFFF;display:flex;flex-direction:column;padding:0 20px 28px;overflow:auto">
    <div style="height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E2E0DA;margin:0 -20px;padding:0 20px">
      <span style="font:700 condensed 22px/1 Archivo,sans-serif;color:#111111;white-space:nowrap"><span style="display:inline-block;padding-bottom:2px;border-bottom:3px solid #FFD100">Focus</span> on the Field</span>
      <button onClick="{{ toggle }}" aria-label="Close menu" style="width:44px;height:44px;border:1.5px solid #111111;border-radius:6px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0" style-focus="outline:2px solid #111111;outline-offset:3px"><span aria-hidden="true" style="width:20px;height:20px;flex:none;display:block;background:#111111;-webkit-mask:url(&quot;assets/icons/x.svg&quot;) center/contain no-repeat;mask:url(&quot;assets/icons/x.svg&quot;) center/contain no-repeat"></span></button>
    </div>
    <nav aria-label="Mobile" style="display:flex;flex-direction:column;margin-top:12px">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="3">
        <a href="{{ n.href }}" onClick="{{ close }}" style="font:600 condensed 36px/1 Archivo,sans-serif;color:#111111;text-decoration:none;padding:18px 0;border-bottom:1px solid #E2E0DA;display:flex;justify-content:space-between;align-items:center">{{ n.label }}<span aria-hidden="true" style="font:400 22px Archivo,sans-serif;color:#1E5B3F">→</span></a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;padding-top:32px;display:flex;flex-direction:column;gap:12px">
      <a href="#book" onClick="{{ close }}" style="display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:6px;background:#FFD100;color:#111111;font:600 17px/1 Archivo,sans-serif;text-decoration:none" style-active="background:#E3BA00" style-focus="outline:2px solid #111111;outline-offset:3px">Book a call</a>
      <a href="#login" style="font:500 17px/1 Archivo,sans-serif;color:#111111;padding:14px 0">Client login</a>
    </div>
  </div>
</sc-if>
<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;left:0;right:0;bottom:0;z-index:60;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#FFFFFF;border-top:1px solid #E2E0DA">
    <a href="#book" onClick="{{ close }}" style="display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:6px;background:#FFD100;color:#111111;font:600 17px/1 Archivo,sans-serif;text-decoration:none" style-active="background:#E3BA00" style-focus="outline:2px solid #111111;outline-offset:3px">Book a call</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1200, &quot;height&quot;: 72}, &quot;active&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;&quot;, &quot;Services&quot;, &quot;How it works&quot;, &quot;About&quot;], &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1200, open: false };
  componentDidMount() { this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.onR); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() {
    const active = this.props.active ?? '';
    const items = [['Services', 'Services.dc.html'], ['How it works', 'Home.dc.html#how'], ['About', 'About.dc.html']];
    const mobile = this.state.w < 960;
    return {
      desktop: !mobile, mobile, open: this.state.open,
      toggle: () => this.setState(s => ({ open: !s.open })),
      close: () => this.setState({ open: false }),
      nav: items.map(([label, href]) => ({ label, href, current: label === active ? 'page' : 'false', line: label === active ? '#FFD100' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
